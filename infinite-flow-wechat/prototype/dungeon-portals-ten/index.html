<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>十款副本传送门 · 无限轮回</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="heading">
      <div><p class="eyebrow">无限轮回 <span>/</span> 场景美术提案</p><h1>副本传送门<span>十个方向</span></h1><p class="intro">把出口放回废墟里。用同一场景、同一人物比例，比较十种形制。</p></div>
      <a class="game-link" href="../../cocos/build/web-mobile/index.html" target="_blank" rel="noopener">查看现有游戏 <span aria-hidden="true">↗</span></a>
    </header>

    <section class="toolbar" aria-label="统一预览设置">
      <div class="control-group" role="group" aria-label="场景"><span class="control-label">场景</span><div class="segmented"><button type="button" data-background="demon_tower_1" aria-pressed="true">妖塔</button><button type="button" data-background="metro_abyss" aria-pressed="false">地铁</button><button type="button" data-background="starfall_mine" aria-pressed="false">矿井</button></div></div>
      <div class="control-group" role="group" aria-label="查看"><span class="control-label">查看</span><div class="segmented"><button type="button" data-mode="scene" aria-pressed="true">放入场景</button><button type="button" data-mode="asset" aria-pressed="false">单独素材</button></div></div>
      <div class="control-group" role="group" aria-label="入口状态"><span class="control-label">入口状态</span><div class="segmented"><button type="button" data-state="available" aria-pressed="true">畅通</button><button type="button" data-state="locked" aria-pressed="false">未开放</button></div></div>
      <p class="toolbar-note">点选任一方案<br><span>与现用石门并排对照</span></p>
    </section>

    <div class="collection-heading"><p><span class="small-diamond" aria-hidden="true"></span>十款独立原型</p><span id="view-description">妖塔 · 场景比例 · 入口畅通</span></div>
    <div class="gallery" id="gallery" aria-label="十款传送门原型"></div>
    <noscript><p class="load-error">请启用 JavaScript 以查看十款原型和场景对比。</p></noscript>
    <p class="page-status" id="page-status" role="status" aria-live="polite"></p>
    <footer class="footer"><p>场景沿用游戏原图；每款门与人物使用一致的尺寸基准。</p><p>此页用于选型，十款新素材尚未替换到游戏。</p></footer>
  </main>

  <dialog id="detail" aria-labelledby="detail-title">
    <header class="dialog-heading"><div><p class="eyebrow" id="detail-number">方案 01 / 10</p><h2 id="detail-title">残檐石阙</h2></div><button class="close-button" id="close-detail" type="button" aria-label="关闭对比">×</button></header>
    <p class="detail-description" id="detail-description"></p>
    <div class="comparison"><figure><figcaption><span>新方案</span><strong id="new-label">残檐石阙</strong></figcaption><div id="new-stage"></div></figure><figure><figcaption><span>现用素材</span><strong>微光石门</strong></figcaption><div id="old-stage"></div></figure></div>
    <div class="detail-bottom"><p id="detail-note"></p><a id="asset-link" href="assets/portal-01.png" target="_blank" rel="noopener">打开透明原图 ↗</a></div>
    <nav class="detail-navigation" aria-label="切换方案"><button id="previous" type="button">← 上一款</button><span id="detail-position">01 / 10</span><button id="next" type="button">下一款 →</button></nav>
  </dialog>
</body>
</html>
