<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">黑曜石环形主神空间</title>
  <desc id="desc">宏大的黑曜石环形大厅中央悬浮着主神光核，远处分布旧金与冷青标识的功能站，正前方是一座带红色危险标记的副本门。</desc>
  <defs>
    <linearGradient id="vault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10181b"/>
      <stop offset="0.48" stop-color="#080c10"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b1d"/>
      <stop offset="0.58" stop-color="#090d10"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <linearGradient id="obsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252c2e"/>
      <stop offset="0.36" stop-color="#0b0f12"/>
      <stop offset="0.7" stop-color="#171c1e"/>
      <stop offset="1" stop-color="#050709"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241715"/>
      <stop offset="0.58" stop-color="#10090a"/>
      <stop offset="1" stop-color="#050405"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="43%" r="58%">
      <stop offset="0" stop-color="#fff4bd"/>
      <stop offset="0.12" stop-color="#e8c76b"/>
      <stop offset="0.32" stop-color="#76cbc4"/>
      <stop offset="0.58" stop-color="#193d40"/>
      <stop offset="0.8" stop-color="#071013"/>
      <stop offset="1" stop-color="#020405"/>
    </radialGradient>
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hallClip">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>

