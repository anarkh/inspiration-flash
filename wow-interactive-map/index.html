            <span>💡 提示：现已支持魔兽世界 1.0 经典旧世 至 11.0 地心之战全部资料片大地图！使用上方导航栏可任意穿梭版本</span>
        </div>

        <!-- Bottom Information HUD -->
        <footer class="bottom-hud">
            <div class="hud-left">
                <div class="coord-display">
                    <span class="continent-name" id="current-continent-name">东部王国 (Eastern Kingdoms)</span>
                    <span class="level-tag" id="current-level-tag">1.0 经典旧世</span>
                    <span>坐标:</span>
                    <span class="coords" id="cursor-coords">X: --, Y: --</span>
                </div>
            </div>

            <div class="hud-right">
                <button class="map-style-toggle active" id="mosaic-toggle-btn" title="切换超高清大地图模式">🧩 模式: 超清大地图</button>
            </div>
        </footer>
    </div>

    <!-- Leaflet JS (local) -->
    <script src="lib/leaflet.js"></script>

    <!-- Application Scripts -->
    <script src="js/map-data.js?v=4"></script>
    <script src="js/app.js?v=dropdown"></script>
</body>
</html>
